name: "Actions to check a matrix with all R and OS versions, computed with the versions-matrix action"
inputs:
  matrix:
    description: "Generated matrix"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install json2yaml
      run: |
        sudo npm install -g json2yaml
      shell: bash

    # The matrix is generated from repository content, so it is passed through
    # the environment: a `${{ }}` splice into the single-quoted assignment below
    # would let a single `'` in the generated JSON escape into the shell.
    - name: Show the matrix as JSON and as YAML
      env:
        MATRIX: ${{ inputs.matrix }}
      run: |
        if [ -n "${MATRIX}" ]; then
          printf '%s' "${MATRIX}" | jq .
          printf '%s' "${MATRIX}" | json2yaml
        else
          echo "No matrix found"
        fi
      shell: bash
