name: "Action to deploy a pkgdown website"

runs:
  using: "composite"
  steps:
    - name: Deploy site
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_minutes: 15
        max_attempts: 10
        command: |
          R -q -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
